plugins {
    id "com.android.application"
}

android {
    namespace "com.fuat.anlikceviri"
    compileSdk 34

    defaultConfig {
        applicationId "com.fuat.anlikceviri"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Kendi imza anahtarın yoksa debug anahtarıyla imzalanır; telefona kurmak için yeterli.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Google ML Kit: telefonun içinde, ücretsiz ve sınırsız çeviri
    implementation "com.google.mlkit:translate:17.0.3"
}
